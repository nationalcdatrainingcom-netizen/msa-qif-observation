<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password — MSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-deep: #2c4a35;
    --green-mid: #4a7c59;
    --gold: #c9953a;
    --gold-soft: #e0b870;
    --cream: #faf8f3;
    --cream-dark: #f0ebe0;
    --line: #ddd8cc;
    --line-soft: #eee8dc;
    --text: #2c2c2c;
    --text-soft: #666;
    --text-muted: #999;
    --error: #b54545;
    --error-bg: #fdf3f3;
    --success: #4a7c59;
    --success-bg: #f0f7f1;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201, 149, 58, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(74, 124, 89, 0.07) 0%, transparent 45%);
  }

  .wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .card {
    background: white;
    border-radius: 20px;
    border: 1.5px solid var(--line);
    box-shadow: 0 8px 40px rgba(44, 74, 53, 0.08);
    width: 100%;
    max-width: 460px;
    overflow: hidden;
  }

  .card-head {
    background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-mid) 100%);
    color: white;
    padding: 36px 36px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card-head::before {
    content: '';
    position: absolute;
    top: -30%;
    right: -20%;
    width: 60%;
    height: 160%;
    background: radial-gradient(circle, rgba(201, 149, 58, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .logo {
    background: var(--gold);
    color: white;
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    width: 56px;
    height: 56px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    box-shadow: 0 4px 16px rgba(201, 149, 58, 0.4);
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 23px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 1;
  }

  .subtitle {
    font-size: 13px;
    opacity: 0.85;
    font-weight: 300;
    letter-spacing: 0.02em;
    position: relative;
    z-index: 1;
  }

  .card-body {
    padding: 32px 36px 30px;
  }

  .greeting {
    background: var(--cream);
    border-left: 3px solid var(--gold);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 22px;
    font-size: 13.5px;
    color: var(--text-soft);
    line-height: 1.55;
  }
  .greeting strong { color: var(--green-deep); font-weight: 600; }

  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-soft);
    margin-bottom: 6px;
  }

  input[type=password] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--cream);
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  input[type=password]:focus {
    outline: none;
    border-color: var(--green-mid);
    background: white;
    box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.12);
  }

  .requirements {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.5;
  }
  .requirements .met { color: var(--success); }
  .requirements .met::before { content: '✓ '; }
  .requirements .unmet::before { content: '○ '; }

  button.primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--green-deep);
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.15s, transform 0.05s;
  }
  button.primary:hover:not(:disabled) { background: var(--green-mid); }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { background: var(--text-muted); cursor: not-allowed; }

  .error {
    background: var(--error-bg);
    border: 1px solid #f0d4d4;
    color: var(--error);
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }

  .help {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .help a {
    color: var(--text-soft);
    text-decoration: none;
    border-bottom: 1px dotted var(--line);
  }
  .help a:hover { color: var(--green-deep); border-bottom-color: var(--green-deep); }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 24px;
    letter-spacing: 0.03em;
  }
  footer .divider {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
    margin: 0 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="card-head">
        <div class="logo">MSA</div>
        <h1>Set Your Password</h1>
        <div class="subtitle">A one-time step before you continue</div>
      </div>
      <div class="card-body">
        <div class="greeting" id="greeting">
          Loading…
        </div>

        <div id="error" class="error"></div>

        <form id="pw-form">
          <div class="field">
            <label for="current-password">Current (Temporary) Password</label>
            <input type="password" id="current-password" required autocomplete="current-password" autofocus>
          </div>
          <div class="field">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" required autocomplete="new-password" minlength="8">
            <div class="requirements" id="req-list">
              <div id="req-length" class="unmet">At least 8 characters</div>
              <div id="req-match" class="unmet">Both new password fields match</div>
            </div>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" required autocomplete="new-password" minlength="8">
          </div>
          <button type="submit" class="primary" id="submit-btn" disabled>Save and Continue</button>
        </form>

        <div class="help">
          <a href="#" id="logout-link">Sign out instead</a>
        </div>
      </div>
    </div>
  </div>
  <footer>
    © Mentor Success Academy
    <span class="divider"></span>
    Mary Wardlaw &amp; Rebecca Munlyn
    <span class="divider"></span>
    All rights reserved
  </footer>

<script>
let me = null;

async function boot() {
  try {
    const r = await fetch('/api/auth/me');
    if (!r.ok) { window.location.href = '/'; return; }
    me = await r.json();
    // If they don't actually need to change their password, send them home
    if (!me.must_change_password) {
      routeByRole(me.role);
      return;
    }
    // Personalized greeting
    const name = firstName(me.full_name);
    const roleLabel = roleLabelFor(me.role);
    document.getElementById('greeting').innerHTML =
      `Welcome, <strong>${escapeHtml(name)}</strong>. ` +
      `You're signed in as a <strong>${escapeHtml(roleLabel)}</strong>. ` +
      `Please choose a password you'll remember — you'll use it to sign in from now on.`;
  } catch (e) {
    window.location.href = '/';
  }
}

function firstName(full) {
  if (!full) return 'there';
  return full.trim().split(/\s+/)[0];
}

function roleLabelFor(role) {
  switch (role) {
    case 'admin': return 'Program Administrator';
    case 'program_director': return 'Program Director';
    case 'mentor': return 'Mentor';
    case 'mentee': return 'Mentee';
    default: return role;
  }
}

function routeByRole(role) {
  switch (role) {
    case 'admin':            window.location.href = '/admin'; break;
    case 'program_director': window.location.href = '/director'; break;
    case 'mentor':           window.location.href = '/mentor'; break;
    case 'mentee':           window.location.href = '/mentee'; break;
    default:                 window.location.href = '/';
  }
}

document.getElementById('logout-link').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/';
});

// ── Live validation ──────────────────────────────────────────────
const newPw = document.getElementById('new-password');
const confirmPw = document.getElementById('confirm-password');
const submitBtn = document.getElementById('submit-btn');
const reqLength = document.getElementById('req-length');
const reqMatch = document.getElementById('req-match');

function validate() {
  const a = newPw.value;
  const b = confirmPw.value;
  const lengthOk = a.length >= 8;
  const matchOk = a.length > 0 && a === b;

  reqLength.className = lengthOk ? 'met' : 'unmet';
  reqMatch.className = matchOk ? 'met' : 'unmet';

  submitBtn.disabled = !(lengthOk && matchOk);
}

[newPw, confirmPw].forEach(el => el.addEventListener('input', validate));

// ── Submit ───────────────────────────────────────────────────────
const errorBox = document.getElementById('error');
function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
function clearError() { errorBox.classList.remove('show'); }

document.getElementById('pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const currentPassword = document.getElementById('current-password').value;
  const newPassword = newPw.value;
  const confirm = confirmPw.value;

  if (newPassword !== confirm) {
    showError('New passwords do not match.');
    return;
  }
  if (newPassword.length < 8) {
    showError('New password must be at least 8 characters.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';

  try {
    const r = await fetch('/api/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentPassword, newPassword })
    });
    const data = await r.json();
    if (!r.ok) {
      showError(data.error || 'Could not update password.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save and Continue';
      return;
    }
    // Success — route to the right dashboard
    routeByRole(me.role);
  } catch (err) {
    showError('Network error. Please try again.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save and Continue';
  }
});

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

boot();
</script>
</body>
</html>
