<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#181614">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mentor Success Academy">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{siteUrl}}/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mentor Success Academy: mentor training for preschool teachers">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{siteUrl}}/img/og-image.jpg">
<!-- Structured data for Google and AI search, built in site/render.js -->
<script type="application/ld+json">
{{jsonld}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>

<div class="announce">
  Now accepting applications for the free research trial, beginning January 2027.<a href="/research-trial">Apply now →</a>
</div>

<header class="nav">
  <div class="container nav-inner">
    <a href="/" class="nav-logo"><img src="/img/msa-logo-light.png" alt="Mentor Success Academy"></a>
    <button class="nav-toggle" aria-label="Open menu" onclick="document.getElementById('nav-links').classList.toggle('open')">☰</button>
    <nav class="nav-links" id="nav-links">
{{nav}}
      <a href="/login" class="btn btn-outline">Sign in</a>
    </nav>
  </div>
</header>

<main id="top">
{{body}}
</main>

<footer>
  <div class="container footer-inner">
    <div>
      <div class="brand">Mentor Success Academy</div>
      <div>&copy; <span id="year"></span> Mentor Success Academy. All rights reserved.</div>
      <nav class="footer-links" aria-label="Site pages">
{{footerNav}}
      </nav>
    </div>
    <div>
      <a href="mailto:info@mentorsuccessacademy.com">Contact us</a> &nbsp;·&nbsp; <a href="/login">Sign in</a>
    </div>
  </div>
</footer>

<script src="/js/site.js"></script>
{{scripts}}
</body>
</html>
